appId: app.petchain.mobile.staging
---
- launchApp
- assertVisible: "Welcome to PetChain"
- tapOn: "Next"
- assertVisible: "Secure Medical Records"
- tapOn: "Next"
- assertVisible: "Smart QR Scanning"
- tapOn: "Next"
- assertVisible: "Veterinarian Network"
- tapOn: "Next"
- assertVisible: "Emergency Ready"
- tapOn: "Get Started"
- assertVisible: "Welcome Back"
- assertVisible: "Sign in to PetMedTracka"
- tapOn: "Email"
- inputText: "test@petchain.app"
- tapOn: "Password"
- inputText: "SuperSecretPassword123"
- tapOn: "Sign In"
---
# RTL smoke flow using the Arabic fixture locale (issue #1052).
# The RTL fixture locale is applied at a controlled reload boundary via
# launchApp env, so I18nManager.forceRTL/allowRTL is never toggled mid-session.
- launchApp:
    clearState: true
    env:
      RTL_FIXTURE_LOCALE: "ar"
- assertVisible: "مرحبًا بك في PetChain"
- tapOn: "التالي"
- assertVisible: "سجلات طبية آمنة"
- tapOn: "التالي"
- assertVisible: "مسح QR الذكي"
- tapOn: "التالي"
- assertVisible: "شبكة الأطباء البيطريين"
- tapOn: "التالي"
- assertVisible: "جاهز للطوارئ"
- tapOn: "ابدأ الآن"
- assertVisible: "مرحبًا بعودتك"
- assertVisible: "تسجيل الدخول إلى PetMedTracka"
- tapOn: "البريد الإلكتروني"
- inputText: "test@petchain.app"
- tapOn: "كلمة المرور"
- inputText: "SuperSecretPassword123"
- tapOn: "تسجيل الدخول"

# Dynamic-type coverage for clinical forms (issue #1037)
# Verifies dosage, consent, and emergency controls remain visible and
# non-overlapping at the maximum supported font size in English and Spanish.
- runFlow:
    when:
      true: true
    commands:
      - setFontScale: 2.0
      - assertVisible: "Dosage"
      - assertVisible: "Consent"
      - assertVisible: "Emergency"
      - assertNotVisible: "Horizontal scroll"
      - setFontScale: 1.0
      - setLocale: "es-ES"
      - setFontScale: 2.0
      - assertVisible: "Dosis"
      - assertVisible: "Consentimiento"
      - assertVisible: "Emergencia"
      - assertNotVisible: "Horizontal scroll"
      - setFontScale: 1.0
      - setLocale: "en-US"

# Dynamic-type clipping coverage for medication and record forms (issue #1077)
# Verifies dosage, date, and multiline clinical fields remain reachable and
# non-overlapping at the largest supported font scale, and that keyboard focus
# scrolls the active field into view.
- runFlow:
    when:
      true: true
    commands:
      - setFontScale: 2.0
      # Medication form: dosage and date fields must stay reachable.
      - tapOn: "Medications"
      - tapOn: "Add Medication"
      - assertVisible: "Dosage"
      - tapOn: "Dosage"
      - inputText: "2.5"
      - assertVisible: "Start Date"
      - tapOn: "Start Date"
      - inputText: "2024-01-01"
      - assertVisible: "Notes"
      - tapOn: "Notes"
      - inputText: "Give with food"
      # Focused multiline field must be scrolled into view, not clipped.
      - assertVisible: "Notes"
      - assertVisible: "Save"
      - tapOn: "Save"
      # Record form: date and multiline clinical fields must stay reachable.
      - tapOn: "Records"
      - tapOn: "Add Record"
      - assertVisible: "Visit Date"
      - tapOn: "Visit Date"
      - inputText: "2024-01-01"
      - assertVisible: "Diagnosis"
      - tapOn: "Diagnosis"
      - inputText: "Routine checkup"
      - assertVisible: "Clinical Notes"
      - tapOn: "Clinical Notes"
      - inputText: "No abnormalities observed"
      - assertVisible: "Clinical Notes"
      - assertVisible: "Save"
      - tapOn: "Save"
      - setFontScale: 1.0
