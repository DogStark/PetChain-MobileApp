name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  privacy-manifest-check:
    name: Privacy manifest & data-safety verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify iOS privacy manifest exists
        run: |
          if [ ! -f "ios/PrivacyInfo.xcprivacy" ]; then
            echo "::error::Missing iOS privacy manifest at ios/PrivacyInfo.xcprivacy"
            exit 1
          fi

      - name: Verify Android data-safety inputs exist
        run: |
          if [ ! -f "android/data-safety.json" ]; then
            echo "::error::Missing Android data-safety inputs at android/data-safety.json"
            exit 1
          fi

      - name: Check required API-reason declarations
        run: |
          REQUIRED_APIS=("NSPrivacyAccessedAPICategoryUserDefaults" "NSPrivacyAccessedAPICategoryFileTimestamp" "NSPrivacyAccessedAPICategorySystemBootTime" "NSPrivacyAccessedAPICategoryDiskSpace")
          for api in "${REQUIRED_APIS[@]}"; do
            if ! grep -q "$api" ios/PrivacyInfo.xcprivacy; then
              echo "::error::Missing required API-reason declaration: $api"
              exit 1
            fi
          done

      - name: Flag undeclared data collection
        run: |
          # Ensure every collected data type in the manifest is declared
          if grep -q "NSPrivacyCollectedDataTypes" ios/PrivacyInfo.xcprivacy; then
            echo "Collected data types declared in iOS manifest."
          else
            echo "::error::No NSPrivacyCollectedDataTypes declared in iOS manifest"
            exit 1
          fi
          if grep -q "dataCollected" android/data-safety.json; then
            echo "Collected data types declared in Android data-safety inputs."
          else
            echo "::error::No dataCollected declarations in Android data-safety inputs"
            exit 1
          fi

      - name: Fail on unexpected permission additions
        run: |
          # Compare declared permissions against an allowlist
          ALLOWED_PERMISSIONS=("NSCameraUsageDescription" "NSLocationWhenInUseUsageDescription" "NSHealthShareUsageDescription" "NSUserTrackingUsageDescription")
          for perm in $(grep -oE 'NS[A-Za-z]+UsageDescription' ios/*.plist 2>/dev/null | sort -u); do
            if [[ ! " ${ALLOWED_PERMISSIONS[*]} " =~ " $perm " ]]; then
              echo "::error::Unexpected permission addition: $perm"
              exit 1
            fi
          done

      - name: Release checklist mapping
        run: |
          if [ ! -f "docs/privacy-release-checklist.md" ]; then
            echo "::error::Missing release checklist at docs/privacy-release-checklist.md"
            exit 1
          fi

  build-provenance-check:
    name: Build provenance & diagnostics verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify EAS configuration exists
        run: |
          if [ ! -f "eas.json" ]; then
            echo "::error::Missing EAS configuration at eas.json"
            exit 1
          fi

      - name: Verify required EAS profiles are defined
        run: |
          REQUIRED_PROFILES=("development" "preview" "staging" "production")
          for profile in "${REQUIRED_PROFILES[@]}"; do
            if ! grep -q "\"$profile\"" eas.json; then
              echo "::error::Missing required EAS profile: $profile"
              exit 1
            fi
          done

      - name: Verify required provenance fields per profile
        run: |
          # Each EAS profile must declare the provenance fields the diagnostics
          # view reads at runtime. Values are generated from EAS config, not
          # hand-maintained strings.
          REQUIRED_FIELDS=("environment" "releaseChannel" "commit" "apiBaseUrl")
          for profile in development preview staging production; do
            for field in "${REQUIRED_FIELDS[@]}"; do
              if ! grep -q "\"$field\"" eas.json; then
                echo "::error::Missing provenance field '$field' for EAS profile '$profile'"
                exit 1
              fi
            done
          done

      - name: Verify diagnostics view is gated behind support/debug access
        run: |
          if ! grep -rq "supportDebug" src 2>/dev/null; then
            echo "::error::Diagnostics view is not gated behind support/debug access"
            exit 1
          fi

      - name: Verify diagnostics redaction is enforced
        run: |
          if ! grep -rq "redactDiagnostics" src 2>/dev/null; then
            echo "::error::Diagnostics redaction helper is missing"
            exit 1
          fi

      - name: Release-build smoke check
        run: |
          # Ensure a release build can resolve provenance metadata without
          # falling back to hand-maintained strings.
          if ! grep -rq "getBuildProvenance" src 2>/dev/null; then
            echo "::error::Release build provenance resolver is missing"
            exit 1
          fi

  localization-completeness-check:
    name: Localization completeness gate (runtime keys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run check-translations gate
        run: |
          # Scans runtime namespaces, enforces required locales, and fails CI
          # for missing or extra critical keys. Output names the file and key
          # path for every violation.
          node scripts/check-translations.js
