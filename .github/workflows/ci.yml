name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  privacy-manifest-check:
    name: Privacy manifest & data-safety verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify iOS privacy manifest exists
        run: |
          if [ ! -f "ios/PrivacyInfo.xcprivacy" ]; then
            echo "::error::Missing iOS privacy manifest at ios/PrivacyInfo.xcprivacy"
            exit 1
          fi

      - name: Verify Android data-safety inputs exist
        run: |
          if [ ! -f "android/data-safety.json" ]; then
            echo "::error::Missing Android data-safety inputs at android/data-safety.json"
            exit 1
          fi

      - name: Check required API-reason declarations
        run: |
          REQUIRED_APIS=("NSPrivacyAccessedAPICategoryUserDefaults" "NSPrivacyAccessedAPICategoryFileTimestamp" "NSPrivacyAccessedAPICategorySystemBootTime" "NSPrivacyAccessedAPICategoryDiskSpace")
          for api in "${REQUIRED_APIS[@]}"; do
            if ! grep -q "$api" ios/PrivacyInfo.xcprivacy; then
              echo "::error::Missing required API-reason declaration: $api"
              exit 1
            fi
          done

      - name: Flag undeclared data collection
        run: |
          # Ensure every collected data type in the manifest is declared
          if grep -q "NSPrivacyCollectedDataTypes" ios/PrivacyInfo.xcprivacy; then
            echo "Collected data types declared in iOS manifest."
          else
            echo "::error::No NSPrivacyCollectedDataTypes declared in iOS manifest"
            exit 1
          fi
          if grep -q "dataCollected" android/data-safety.json; then
            echo "Collected data types declared in Android data-safety inputs."
          else
            echo "::error::No dataCollected declarations in Android data-safety inputs"
            exit 1
          fi

      - name: Fail on unexpected permission additions
        run: |
          # Compare declared permissions against an allowlist
          ALLOWED_PERMISSIONS=("NSCameraUsageDescription" "NSLocationWhenInUseUsageDescription" "NSHealthShareUsageDescription" "NSUserTrackingUsageDescription")
          for perm in $(grep -oE 'NS[A-Za-z]+UsageDescription' ios/*.plist 2>/dev/null | sort -u); do
            if [[ ! " ${ALLOWED_PERMISSIONS[*]} " =~ " $perm " ]]; then
              echo "::error::Unexpected permission addition: $perm"
              exit 1
            fi
          done

      - name: Release checklist mapping
        run: |
          if [ ! -f "docs/privacy-release-checklist.md" ]; then
            echo "::error::Missing release checklist at docs/privacy-release-checklist.md"
            exit 1
          fi
